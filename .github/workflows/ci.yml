name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - name: E2E (skip visual until linux baselines exist)
        run: |
          if ls tests/e2e/visual.spec.ts-snapshots/*-linux.png >/dev/null 2>&1; then
            npx playwright test
          else
            npx playwright test --grep-invert "visual:"
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
